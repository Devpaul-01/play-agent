[project]
name = "play-agent"
version = "0.1.0"
description = "Self-healing E2E test agent: diagnoses and repairs stale Playwright locators."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "groq>=0.11",
    "tree-sitter>=0.23",
    "tree-sitter-typescript>=0.23",
    "pydantic>=2.9",
    "click>=8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.7",
]

[project.scripts]
play-agent = "play_agent.cli.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/play_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
